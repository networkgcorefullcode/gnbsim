---
info:
  version: 1.0.0
  description: GNBSIM initial local configuration

configuration:
  runConfigProfilesAtStart: true
  singleInterface: true #default value
  execInParallel: true #run all profiles in parallel
  httpServer: # Serves APIs to create/control profiles on the go
    enable: false
    ipAddr: "localhost" # your server ip
    port: 8080
  gnbs: # pool of gNodeBs
    gnb1:
      n2IpAddr: "localhost" # gNB N2 interface IP address used to connect to AMF
      n2Port: 9487 # gNB N2 Port used to connect to AMF
      #n3IpAddr: 192.168.251.5 # gNB N3 interface IP address used to connect to UPF. when singleInterface mode is false
      n3IpAddr: "localhost" # when gnb is deployed in singleInterface mode
      n3Port: 2152 # gNB N3 Port used to connect to UPF
      name: gnb1 # gNB name that uniquely identify a gNB within application
      globalRanId:
        plmnId:
          mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
        gNbId:
          bitLength: 24
          gNBValue: 000102 # gNB identifier (3 bytes hex string, range: 000000~FFFFFF)
      supportedTaList:
        - tac: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)
          broadcastPlmnList:
            - plmnId:
                mcc: 208
                mnc: 93
              taiSliceSupportList:
                - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
                  sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
                - sst: 1
                  sd: 000001
                - sst: 2
      defaultAmf:
        hostName: 192.168.12.16 # Host name of AMF
        ipAddr: # AMF IP address
        port: 30071 # AMF port

  profiles: # profile information
    - profileType: register # profile type
      profileName: profile1 # uniqely identifies a profile within application
      enable: true # Set true to execute the profile, false otherwise.
      gnbName: gnb1 # gNB to be used for this profile
      startImsi: 208930100007487
      ueCount: 100
      defaultAs: "8.8.8.8" #default icmp pkt destination
      opc: "981d464c7c52eb6e5036234984ad0bcf"
      key: "5122250214c33e723a5dd523fc145fc0"
      sequenceNumber: "16f3b3f70fc2"
      dnn: "internet"
      sNssai:
        sst: 1 # Slice/Service Type (uinteger, range: 0~255)
        sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
      execInParallel: true #run all subscribers within profile in parallel
      plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
    - profileType: register # profile type
      profileName: profile2 # uniqely identifies a profile within application
      enable: true # Set true to execute the profile, false otherwise.
      gnbName: gnb1 # gNB to be used for this profile
      startImsi: 208930100008000
      ueCount: 499
      defaultAs: "8.8.8.8" #default icmp pkt destination
      opc: "981d464c7c52eb6e5036234984ad0bcf"
      key: "5122250214c33e723a5dd523fc145fc0"
      sequenceNumber: "16f3b3f70fc2"
      dnn: "internet"
      sNssai:
        sst: 1 # Slice/Service Type (uinteger, range: 0~255)
        sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
      execInParallel: true #run all subscribers within profile in parallel
      plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
    
logger:
  logLevel: info # how detailed the log will be, values: debug, info, warn, error, fatal, panic
